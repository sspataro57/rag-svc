apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-tes

# No CronJobs in this overlay — TES gets fed via POST /ingest/jira
# (reconstructed Jira tickets) and POST /ingest/document (personal-
# project summaries) on demand.
resources:
  - namespace.yaml
  - ../../base
  - service-lan.yaml

patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: rag-svc-config

images:
  - name: 192.168.50.20:5000/rag-svc
    newTag: "0.1.3"
