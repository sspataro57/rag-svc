# TES overlay secret. Copy to secret.yaml, fill in real values, apply:
#   kubectl apply -n rag-tes -f deploy/k8s/overlays/prod-tes/secret.yaml
# secret.yaml is gitignored; never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: rag-svc-secrets
  namespace: rag-tes
type: Opaque
stringData:
  DATABASE_URL: "postgres://app:REPLACE_ME@pg-main-rw.cnpg.svc.cluster.local:5432/rag_tes?sslmode=disable"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_SENTINEL_PASSWORD: "REPLACE_ME"

  # Real OpenAI key — codex LAN endpoint has no /embeddings.
  EMBED_API_KEY: "REPLACE_ME"
  ANSWER_API_KEY: "placeholder"

  # No Atlassian credentials — corpus is fed via /ingest/* APIs.
