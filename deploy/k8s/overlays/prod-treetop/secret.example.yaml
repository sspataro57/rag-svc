# Treetop overlay secret. Copy to secret.yaml in this directory, fill
# in real values, and apply directly:
#   kubectl apply -n rag-treetop -f deploy/k8s/overlays/prod-treetop/secret.yaml
# secret.yaml is gitignored; never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: rag-svc-secrets
  namespace: rag-treetop
type: Opaque
stringData:
  DATABASE_URL: "postgres://app:REPLACE_ME@pg-main-rw.cnpg.svc.cluster.local:5432/rag_treetop?sslmode=disable"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_SENTINEL_PASSWORD: "REPLACE_ME"

  # Real OpenAI key — codex LAN endpoint has no /embeddings.
  EMBED_API_KEY: "REPLACE_ME"
  # LAN answer endpoint accepts any string; placeholder is fine.
  ANSWER_API_KEY: "placeholder"

  JIRA_EMAIL: "REPLACE_ME@treetopllc.com"
  JIRA_TOKEN: "REPLACE_ME"
  CONFLUENCE_EMAIL: "REPLACE_ME@treetopllc.com"
  CONFLUENCE_TOKEN: "REPLACE_ME"
