# Template for the per-overlay secret. Each overlay copies this to
# secret.yaml, fills in real values, and applies it directly with
#   kubectl apply -n <namespace> -f overlays/<overlay>/secret.yaml
#
# Do NOT commit the populated version — both overlay directories
# already gitignore secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: rag-svc-secrets
type: Opaque
stringData:
  # ---- Postgres ----
  # postgres://app:<pw>@pg-main-rw.cnpg.svc.cluster.local:5432/<db>?sslmode=disable
  DATABASE_URL: "REPLACE_ME"

  # ---- Redis (Valkey-Sentinel auth) ----
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_SENTINEL_PASSWORD: "REPLACE_ME"

  # ---- LLM API keys ----
  # Real OpenAI key for embeddings; LAN answer endpoint may need any
  # placeholder string (it doesn't validate).
  EMBED_API_KEY: "REPLACE_ME"
  ANSWER_API_KEY: "placeholder"

  # ---- Atlassian (Treetop overlay only — leave blank for TES) ----
  JIRA_TOKEN: ""
  CONFLUENCE_TOKEN: ""
