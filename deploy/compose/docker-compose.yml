services:
  # Postgres, Redis, and MinIO are reachable to rag-svc via the compose
  # network; host port mappings are intentionally omitted so this stack
  # boots cleanly on machines with existing Postgres/Redis/MinIO on their
  # default ports. If you need host access (psql, redis-cli, MinIO console),
  # add a `ports:` block under the relevant service.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragsvc
      POSTGRES_PASSWORD: ragsvc
      POSTGRES_DB: ragsvc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragsvc -d ragsvc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-svc:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://ragsvc:ragsvc@postgres:5432/ragsvc?sslmode=disable
      REDIS_MODE: standalone
      REDIS_URL: redis://redis:6379/0
      # Optional global Redis key prefix. Empty by default for compose;
      # k8s overlays set "rag-treetop:" / "rag-tes:" / "rag-personal:"
      # so multiple instances can share one Valkey safely.
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-}"
      BLOB_ENDPOINT: http://minio:9000
      BLOB_BUCKET: rag-svc
      BLOB_ACCESS_KEY: minioadmin
      BLOB_SECRET_KEY: minioadmin
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      # LLM / Atlassian / OIDC / Slack creds are read from the shell env via
      # interpolation so they stay out of this committed file. Set them
      # (e.g., `export EMBED_API_KEY=$OPENAI_API_KEY`) before `docker compose
      # up` to exercise those code paths. Missing values remain empty ⇒
      # retrieval falls back to the fake embedder with a warning.
      EMBED_API_KEY: "${EMBED_API_KEY:-}"
      ANSWER_API_KEY: "${ANSWER_API_KEY:-}"
      JIRA_BASE_URL: "${JIRA_BASE_URL:-}"
      JIRA_EMAIL: "${JIRA_EMAIL:-}"
      JIRA_TOKEN: "${JIRA_TOKEN:-}"
      JIRA_PROJECTS: "${JIRA_PROJECTS:-}"
      CONFLUENCE_BASE_URL: "${CONFLUENCE_BASE_URL:-}"
      CONFLUENCE_EMAIL: "${CONFLUENCE_EMAIL:-}"
      CONFLUENCE_TOKEN: "${CONFLUENCE_TOKEN:-}"
      CONFLUENCE_SPACES: "${CONFLUENCE_SPACES:-}"
      EXTENSION_ID: "${EXTENSION_ID:-}"
      WEB_UI_ORIGIN: "${WEB_UI_ORIGIN:-}"
      SEARCH_RATE_LIMIT_PER_USER: "${SEARCH_RATE_LIMIT_PER_USER:-30}"
    ports:
      - "8080:8080"
    # Override ENTRYPOINT so we can chain migrate + serve. A proper entrypoint
    # script can replace this once the skeleton grows past /healthz.
    entrypoint: ["/bin/sh", "-c"]
    command: ["rag-svc migrate && exec rag-svc serve"]

volumes:
  pgdata:
  miniodata:
